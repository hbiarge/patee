version: 1.0
steps:
  - type: docling_extractor
    name: extract
    config:
      labels_to_extract: # https://docling-project.github.io/docling/reference/docling_document/#docling_core.types.doc.DocItemLabel
        - section_header
        - text
        - list_item
      formats:
        - pdf:
            parser: docling # docling | pypdfium

  - type: regex_filter
    name: filter_lines
    config:
      include:
#        - name: definitions
#          regex: "^[A-Z-]+$"
        - name: SV blocks starting with a lowercase letter
          regex: "(^[a-z]{1}.+) (SV),"  #"(^[a-z]{1}.+) (SV),(.+$)" "^[a-z]{1}.+ SV,"

  - type: regex_replace
    name: cleanup_and_normalize
    config:
      replacements:
#        - name: remove parenthesis
#          regex: "\\(.*?\\)"
#          replacement: ""
        - name: remove leading whitespace
          regex: "^\\s+"
          replacement: ""
        - name: remove trailing whitespace
          regex: "\\s+$"
          replacement: ""
        - name: replace multiple spaces with a single space
          regex: "\\s{2,}"
          replacement: " "

  - type: write_to_file
    name: save
    config:
      output_path: ./outputs # working directory relative
      blocks_separator: "\n"
      encoding: utf-8